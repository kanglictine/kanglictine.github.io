:root { --yellow: #fff7d9; }

const TASKS = [{"t": "c", "p": "Vyber správny preklad.", "e": "snowflake", "o": ["snehová vločka", "snehuliak", "cencúľ", "sánky"], "a": ["snehová vločka"], "h": "Padá z neba a je malá.", "n": "snowflake = snehová vločka, snowman = snehuliak, icicle = cencúľ."}, {"t": "t", "p": "Napíš po anglicky: snehuliak", "e": "", "o": null, "a": ["snowman"], "h": "snow + man", "n": "snowman = snow (sneh) + man (muž)."}, {"t": "c", "p": "Vyber správnu možnosť.", "e": "Every year we ___ the tree together.", "o": ["decorate", "decorates", "decorating", "to decorate"], "a": ["decorate"], "h": "We + základný tvar slovesa.", "n": "Po we používame základný tvar: we decorate."}, {"t": "c", "p": "Čo znamená táto fráza?", "e": "wrapping paper", "o": ["baliaci papier", "pohľadnica", "sviečka", "lepiaca páska"], "a": ["baliaci papier"], "h": "Zabaľuješ ním darčeky.", "n": "to wrap = baliť."}, {"t": "t", "p": "Zoraď písmená a napíš slovo (sob).", "e": "E D E R N I E R", "o": null, "a": ["reindeer"], "h": "Ťahá Santove sane.", "n": "reindeer = sob (množné číslo je tiež reindeer)."}, {"t": "c", "p": "Ako po anglicky povieme Mikuláš?", "e": "", "o": ["St Nicholas", "Santa Princess", "Father Winter", "Saint George"], "a": ["st nicholas", "saint nicholas"], "h": "6. decembra.", "n": "St Nicholas Day je 6. decembra."}, {"t": "c", "p": "Je mráz! Vyber správnu možnosť.", "e": "It's freezing! ___ your gloves.", "o": ["Put on", "Put off", "Put up", "Put in"], "a": ["put on"], "h": "obliecť si = put on", "n": "put on = obliecť si, take off = vyzliecť."}, {"t": "t", "p": "Doplň chýbajúce slovo (zhasnúť svetlo).", "e": "Don't forget to ___ the lights off.", "o": null, "a": ["turn"], "h": "turn off = vypnúť.", "n": "turn off = vypnúť, turn on = zapnúť."}, {"t": "c", "p": "Vyber synonymum k slovu gift.", "e": "gift", "o": ["present", "parcel", "candle", "stocking"], "a": ["present"], "h": "Dostaneš ho pod stromčekom.", "n": "gift = present = darček."}, {"t": "t", "p": "Napíš po anglicky: sviečka", "e": "", "o": null, "a": ["candle"], "h": "Zapaľuje sa na adventnom venci.", "n": "candle = sviečka."}, {"t": "c", "p": "Vyber správny tvar.", "e": "Last Christmas we ___ to the mountains.", "o": ["went", "go", "goes", "going"], "a": ["went"], "h": "Minulý čas slovesa go.", "n": "go – went – gone."}, {"t": "c", "p": "Vyber správny predložku.", "e": "We open presents ___ Christmas morning.", "o": ["on", "in", "at", "by"], "a": ["on"], "h": "Pri dňoch a ránach: on.", "n": "on Christmas morning, on Monday."}, {"t": "t", "p": "Doplň druhý tvar slovesa give.", "e": "Santa ___ me a book last year.", "o": null, "a": ["gave"], "h": "give – gave – given", "n": "give – gave – given je nepravidelné sloveso."}, {"t": "c", "p": "Ktoré slovo NEPATRÍ k zime?", "e": "", "o": ["sledge", "scarf", "sunscreen", "icicle"], "a": ["sunscreen"], "h": "Používa sa v lete.", "n": "sunscreen = opaľovací krém."}, {"t": "t", "p": "Zoraď písmená a napíš slovo (palčiaky).", "e": "T E N T I M S", "o": null, "a": ["mittens"], "h": "Nosíš ich na rukách.", "n": "mittens = palčiaky."}, {"t": "c", "p": "Vyber správny tvar.", "e": "If it snows tomorrow, we ___ a snowman.", "o": ["will build", "would build", "build", "built"], "a": ["will build"], "h": "If + prítomný čas, will + sloveso.", "n": "If it snows, we will build ... (1. kondicionál)."}, {"t": "t", "p": "Doplň tvar slovesa be.", "e": "There ___ a lot of snow last night.", "o": null, "a": ["was"], "h": "Minulý čas, jednotné číslo.", "n": "a lot of snow je nepočítateľné, preto was."}, {"t": "c", "p": "Vyber správny preklad.", "e": "chimney", "o": ["komín", "krb", "strecha", "okno"], "a": ["komín"], "h": "Cezeň prichádza Santa.", "n": "chimney = komín, fireplace = krb."}, {"t": "c", "p": "Vyber správny tvar.", "e": "Santa has ___ the presents.", "o": ["brought", "bring", "brang", "bringed"], "a": ["brought"], "h": "bring – brought – brought", "n": "bring – brought – brought."}, {"t": "t", "p": "Doplň predložku (pod).", "e": "A present ___ the tree.", "o": null, "a": ["under"], "h": "pod = under", "n": "under = pod, over = nad."}, {"t": "c", "p": "Vyber správne slovo.", "e": "The shortest day of the year is the winter ___.", "o": ["solstice", "season", "holiday", "weather"], "a": ["solstice"], "h": "Zimný slnovrat.", "n": "winter solstice = zimný slnovrat (okolo 21. decembra)."}, {"t": "t", "p": "Doplň chýbajúce slovo.", "e": "Our family gets ___ on Christmas Eve.", "o": null, "a": ["together"], "h": "Stretneme sa spolu.", "n": "get together = stretnúť sa."}, {"t": "c", "p": "Čo odpovieš?", "e": "Merry Christmas!", "o": ["Merry Christmas to you too!", "You're welcome.", "Nice to meet you.", "I'm sorry."], "a": ["merry christmas to you too!", "merry christmas to you too"], "h": "Odpovedz rovnakým prianím.", "n": "Merry Christmas to you too! = Aj tebe veselé Vianoce!"}, {"t": "t", "p": "Posledné okienko! Doplň prianie.", "e": "Merry ___ and a happy New Year!", "o": null, "a": ["christmas"], "h": "Veselé ...", "n": "Merry Christmas and a happy New Year! Gratulujeme, zvládol si to!"}].slice(0, N);

const $app = document.getElementById('app');
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- date (test: ?den=3 simulates day 3 of the calendar) ----
const qs = new URLSearchParams(location.search);
function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayDate(n) { const d = new Date(START); d.setDate(d.getDate() + n - 1); return d; }
const doorISO = n => isoOf(dayDate(n));
function openDays() {            // how many doors are open today (0..N)
  if (qs.has('den')) return Math.min(Math.max(parseInt(qs.get('den'), 10) || 0, 0), N);
  const t = new Date(), t0 = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.min(Math.max(Math.round((t0 - START) / 86400000) + 1, 0), N);
}
function todayISO() { return qs.has('den') ? doorISO(Math.max(openDays(), 1)) : isoOf(new Date()); }
const MONTHS = ['januára','februára','marca','apríla','mája','júna','júla','augusta','septembra','októbra','novembra','decembra'];
const startText = () => START.getDate() + '. ' + MONTHS[START.getMonth()];

// ---- state ----
let S = { nick: '', done: {} };
let mem = null;
function load() { try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) { if (mem) S = mem; } }
function save() { mem = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
load();

// ---- code ----
function h53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function maskOf(done) { let m = 0; for (let i = 1; i <= N; i++) if (done[i]) m |= (1 << (i - 1)); return m >>> 0; }
function onTimeCount(done) { let c = 0; for (let i = 1; i <= N; i++) if (done[i] === doorISO(i)) c++; return c; }
function makeCode(nick, mask, ot) {
  const m = mask.toString(16).toUpperCase().padStart(6, '0');
  const o = pad(ot);
  const chk = h53(nick.toLowerCase() + '|' + m + '|' + o + '|' + SALT).toString(16).toUpperCase().slice(-6).padStart(6, '0');
  return 'KA-' + m + '-' + o + '-' + chk;
}
function checkCode(nick, code) {
  const m = /^KA-([0-9A-F]{6})-(\d{2})-([0-9A-F]{6})$/.exec(code.trim().toUpperCase());
  if (!m) return null;
  const ok = makeCode(nick.replace(/^@/, '').trim(), parseInt(m[1], 16), parseInt(m[2], 10)) === code.trim().toUpperCase();
  if (!ok) return null;
  let days = 0; for (let i = 0; i < N; i++) if (parseInt(m[1], 16) & (1 << i)) days++;
  return { days, ot: parseInt(m[2], 10) };
}

// ---- helpers ----
const norm = s => s.toLowerCase().replace(/[.,!?;:"“”]/g, '').replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();
function shuffled(arr, seed) { const a = arr.slice(); let s = seed * 9301 + 49297; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const doneCount = () => Object.keys(S.done).length;
function fmtDate(iso) { const [y, m, d] = iso.split('-'); return +d + '. ' + +m + '. ' + y; }

// ---- views ----
let view = 'home', cur = 0, wrongs = 0;
function go(v, d) { view = v; cur = d || 0; wrongs = 0; render(); window.scrollTo(0, 0); }

function render() {
  if (location.hash === '#overit') return renderVerify();
  if (!S.nick) return renderWelcome();
  if (view === 'task') return renderTask();
  if (view === 'diploma') return renderDiploma();
  return renderCalendar();
}

function renderWelcome(err) {
  $app.innerHTML = `
    <h1>Adventný <em>kalendár</em></h1>
    <p class="lead">Každý deň sa otvorí jedno okienko s anglickou úlohou. Splň všetkých ${N} a dostaneš šancu vyhrať cenu.</p>
    <form id="f" class="field" autocomplete="off">
      <p class="label">Tvoj nick na Instagrame</p>
      <input id="nick" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="napr. petra.anglictina" maxlength="31" aria-label="Nick na Instagrame">
      <p class="small">Bez @. Uloží sa len v tvojom telefóne, nikam sa neposiela. Na konci pošleš diplom do DM na Instagrame.</p>
      ${err ? `<p class="err">${err}</p>` : ''}
      <button class="btn primary block" type="submit">Začať</button>
    </form>
    <div class="foot"><span>Okienka sa otvárajú od ${startText()}.</span>${TEST ? '<span><b>Testovacia verzia</b></span>' : ''}</div>`;
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('nick').value.trim().replace(/^@/, '');
    if (!/^[A-Za-z0-9._]{1,30}$/.test(v)) return renderWelcome('Nick môže obsahovať len písmená, čísla, bodku a podčiarkovník.');
    S.nick = v; save(); go('home');
  });
}

function renderCalendar() {
  const open = openDays(), dc = doneCount();
  let cells = '';
  for (let n = 1; n <= N; n++) {
    let cls = 'locked', sub = '';
    const isDone = !!S.done[n];
    if (n > open) { cls = 'locked'; }
    else if (isDone) { cls = 'done'; sub = '✓'; }
    else if (n === open) { cls = 'today'; sub = 'dnes'; }
    else { cls = 'missed'; sub = 'dobehni'; }
    cells += `<button class="door ${cls}" data-d="${n}" ${n > open ? 'disabled aria-disabled="true"' : ''} aria-label="Okienko ${n}">${n}${sub ? `<small>${sub}</small>` : ''}</button>`;
  }
  const finished = dc === N;
  $app.innerHTML = `
    <div class="bar"><h1 style="font-size:28px">Ahoj, <em>@${esc(S.nick)}</em></h1><span class="count">${dc} / ${N}</span></div>
    ${open === 0 ? `<p class="lead">Kalendár sa otvorí <b>${startText()}</b>. Príď sa pozrieť na prvé okienko!</p>` : `<p class="lead" style="margin-bottom:14px">${finished ? 'Všetko splnené! Vyzdvihni si diplom.' : 'Vyber si okienko. Môžeš dobehnúť aj zmeškané dni.'}</p>`}
    ${finished ? `<button class="btn primary block" id="dip" style="margin-bottom:18px">Zobraziť diplom</button>` : ''}
    <div class="grid">${cells}</div>
    <div class="legend"><span><i style="background:var(--blue)"></i>dnes</span><span><i style="background:var(--good)"></i>splnené</span><span><i style="background:var(--yellow)"></i>zmeškané</span><span><i style="border-style:dashed;border-color:var(--hair)"></i>zatvorené</span></div>
    <div class="foot"><button class="link" id="chg">Zmeniť nick</button></div>`;
  $app.querySelectorAll('.door:not(.locked)').forEach(b => b.addEventListener('click', () => go('task', +b.dataset.d)));
  const dip = document.getElementById('dip'); if (dip) dip.addEventListener('click', () => go('diploma'));
  const chg = document.getElementById('chg');
  chg.addEventListener('click', () => {
    if (chg.dataset.sure) { S = { nick: '', done: {} }; save(); go('home'); }
    else { chg.dataset.sure = 1; chg.textContent = 'Naozaj? Stratíš svoj postup. Klikni ešte raz.'; }
  });
}

function renderTask() {
  const T = TASKS[cur - 1];
  const finished = !!S.done[cur];
  const head = `<button class="back" id="bk">← Kalendár</button><p class="label">Okienko ${cur}</p>`;
  let body = `<div class="card"><p class="q">${esc(T.p)}</p>${T.e ? `<p class="big">${esc(T.e)}</p>` : ''}</div>`;
  if (T.t === 'c') {
    const opts = shuffled(T.o, cur);
    body += `<div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else {
    body += `<form id="tf" class="field" autocomplete="off"><input id="ans" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Tvoja odpoveď" aria-label="Odpoveď"><div style="height:12px"></div><button class="btn primary block" type="submit">Skontrolovať</button></form>`;
  }
  body += `<div id="fb"></div>`;
  $app.innerHTML = head + body;
  document.getElementById('bk').addEventListener('click', () => go('home'));
  const fb = document.getElementById('fb');
  const win = () => {
    if (!S.done[cur]) { S.done[cur] = todayISO(); save(); }
    fb.innerHTML = `<p class="msg ok"><b>Správne!</b> ${esc(T.n)}</p><button class="btn primary block" id="nx">${doneCount() === N ? 'Zobraziť diplom' : 'Späť na kalendár'}</button>`;
    document.getElementById('nx').addEventListener('click', () => go(doneCount() === N ? 'diploma' : 'home'));
  };
  const lose = () => { wrongs++; fb.innerHTML = `<p class="msg hint"><b>Skús ešte raz.</b> Nápoveda: ${esc(T.h)}</p>`; };
  if (T.t === 'c') {
    const opts = shuffled(T.o, cur);
    $app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const val = opts[+b.dataset.i];
      if (T.a.includes(norm(val))) {
        $app.querySelectorAll('.opt').forEach(x => x.disabled = true); b.classList.add('ok'); win();
      } else { b.classList.add('bad'); b.disabled = true; lose(); }
    }));
  } else {
    const f = document.getElementById('tf'), inp = document.getElementById('ans');
    f.addEventListener('submit', e => {
      e.preventDefault();
      if (inp.disabled) return;
      const v = norm(inp.value);
      if (!v) return;
      if (T.a.includes(v)) { inp.classList.remove('bad'); inp.classList.add('ok'); inp.disabled = true; f.querySelector('button').disabled = true; win(); }
      else { inp.classList.add('bad'); lose(); }
    });
    inp.addEventListener('input', () => inp.classList.remove('bad'));
  }
  if (finished) { // already done: show it
    if (T.t === 'c') { const opts = shuffled(T.o, cur); $app.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (T.a.includes(norm(opts[i]))) b.classList.add('ok'); }); }
    else { const inp = document.getElementById('ans'); inp.value = T.a[0]; inp.classList.add('ok'); inp.disabled = true; document.querySelector('#tf button').disabled = true; }
    fb.innerHTML = `<p class="msg ok"><b>Splnené ${esc(fmtDate(S.done[cur]))}.</b> ${esc(T.n)}</p><button class="btn block" id="nx">Späť na kalendár</button>`;
    document.getElementById('nx').addEventListener('click', () => go('home'));
  }
}

function renderDiploma() {
  const mask = maskOf(S.done), ot = onTimeCount(S.done), code = makeCode(S.nick, mask, ot);
  const all = doneCount() === N;
  const last = all ? Object.values(S.done).sort().slice(-1)[0] : '';
  $app.innerHTML = `
    <button class="back" id="bk">← Kalendár</button>
    <div class="diploma">
      <p class="label">Adventný kalendár ${TEST ? '(test)' : '2026'}</p>
      <div class="serif">Diplom</div>
      <div class="nick">@${esc(S.nick)}</div>
      <p style="margin:0">${all ? 'splnil/a všetkých ' + N + ' okienok' : 'splnené: ' + doneCount() + ' / ' + N}</p>
      ${all ? `<p class="small" style="margin:6px 0 0">dokončené ${esc(fmtDate(last))} · v ten deň: ${ot} / ${N}</p>` : ''}
      <div class="code" id="code">${esc(code)}</div>
    </div>
    ${all ? `<p class="label">Ako sa zapojiť do žrebovania</p>
    <ol class="steps"><li>Urob snímku obrazovky tohto diplomu.</li><li>Pošli ju do DM na Instagrame: <b>@${esc(INSTA)}</b>.</li><li>Pošli ju z vlastného účtu <b>@${esc(S.nick)}</b>.</li></ol>
    <button class="btn block" id="cp">Skopírovať kód</button>` : `<p class="lead">Diplom bude platný, keď splníš všetkých ${N} okienok.</p>`}`;
  document.getElementById('bk').addEventListener('click', () => go('home'));
  const cp = document.getElementById('cp');
  if (cp) cp.addEventListener('click', async () => { try { await navigator.clipboard.writeText(code); cp.textContent = 'Skopírované ✓'; } catch (e) { cp.textContent = 'Kód označ a skopíruj ručne'; } });
}

function renderVerify() {
  $app.innerHTML = `
    <h1>Overenie <em>kódu</em></h1>
    <p class="lead">Pre učiteľku: zadaj nick a kód z diplomu.</p>
    <form id="vf" class="field" autocomplete="off">
      <input id="vn" type="text" placeholder="nick (bez @)" autocapitalize="off" spellcheck="false" aria-label="Nick"><div style="height:10px"></div>
      <input id="vc" type="text" placeholder="KA-XXXXXX-00-XXXXXX" autocapitalize="characters" spellcheck="false" aria-label="Kód"><div style="height:12px"></div>
      <button class="btn primary block" type="submit">Overiť</button>
    </form>
    <div id="vr" style="margin-top:14px"></div>`;
  document.getElementById('vf').addEventListener('submit', e => {
    e.preventDefault();
    const r = checkCode(document.getElementById('vn').value, document.getElementById('vc').value);
    document.getElementById('vr').innerHTML = r
      ? `<p class="msg ok"><b>Kód je platný.</b> Splnené dni: ${r.days} / ${N}, v správny deň: ${r.ot} / ${N}.${r.days === N ? ' Spĺňa podmienky žrebovania.' : ' Nespĺňa podmienky (treba ' + N + ').'}</p>`
      : `<p class="err"><b>Neplatný kód</b> alebo nesedí nick.</p>`;
  });
}
window.addEventListener('hashchange', render);
render();
</script>
