<html lang="sk">
<head>
<meta charset="utf-8">

<title>Tréner nepravidelných slovies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Mulish:wght@400;500;700;800;900&display=swap">
<style>
/* Layout idea: one narrow column, big type, pastel K blobs behind, same look as the printed booklet. */
:root {
  --paper: #f2f2f2;
  --ink: #111318;
  --mute: #4a505c;
  --hair: #c6c6c6;
  --blue: #cde7ff;
  --pink: #ffd6d6;
  --good: #8fd1a3;
  --bad: #f59a9a;
  --sans: 'Mulish', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
  --serif: 'Instrument Serif', 'Times New Roman', serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.blob { position: fixed; z-index: -1; pointer-events: none; filter: blur(14px); }
.blob.a { width: 420px; right: -150px; top: -60px; transform: rotate(-16deg); }
.blob.b { width: 360px; left: -160px; bottom: -110px; transform: rotate(22deg); }
.wrap { max-width: 520px; margin: 0 auto; padding: 20px 20px 48px; }
.top { display: flex; align-items: center; gap: 9px; height: 32px; margin-bottom: 28px; }
.top svg { width: 20px; height: auto; }
.top b { font-weight: 800; letter-spacing: -0.02em; font-size: 15px; }
.top .tag { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
h1 { margin: 0; font-size: 34px; line-height: 1.02; font-weight: 800; letter-spacing: -0.04em; }
h1 em, .serif { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
h1 em { font-size: 1.12em; }
.lead { margin: 12px 0 26px; color: var(--mute); max-width: 36ch; }
.label { margin: 0 0 10px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.sect { margin-bottom: 26px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip { min-height: 40px; padding: 8px 14px; border: 1px solid var(--ink); border-radius: 999px; background: transparent; font-size: 13px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.modes { display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; text-align: left; padding: 14px 16px; border: 1px solid var(--hair); border-radius: 14px; background: rgba(255,255,255,.55); }
.mode b { font-size: 17px; letter-spacing: -0.02em; }
.mode span { grid-column: 1; font-size: 13px; color: var(--mute); }
.mode i { grid-row: 1 / span 2; grid-column: 2; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink); }
.mode[aria-checked="true"] { border-color: var(--ink); background: #fff; }
.mode[aria-checked="true"] i { background: radial-gradient(var(--ink) 0 45%, transparent 50%); }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 12px 26px; border-radius: 999px; border: 1px solid var(--ink); font-weight: 800; font-size: 16px; letter-spacing: -0.01em; background: transparent; }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.block { width: 100%; }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; }
.gamebar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--ink); background: transparent; font-size: 20px; line-height: 1; }
.prog { flex: 1; height: 4px; background: var(--hair); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ink); }
.count { font-size: 12px; font-weight: 800; letter-spacing: .08em; min-width: 44px; text-align: right; }
.prompt { padding: 26px 22px; background: #fff; border: 1px solid var(--hair); border-radius: 20px; margin-bottom: 14px; }
.prompt .big { font-size: 48px; line-height: 1; font-weight: 900; letter-spacing: -0.05em; margin: 4px 0 6px; overflow-wrap: anywhere; }
.prompt .sk { font-family: var(--serif); font-style: italic; font-size: 24px; color: var(--mute); }
.forms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.form { padding: 14px 16px; border-radius: 14px; background: var(--blue); }
.form .big { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; overflow-wrap: anywhere; }
.ipa { font-size: 13px; color: var(--mute); margin: -4px 0 14px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.field label { display: block; margin-bottom: 6px; }
.field input { width: 100%; min-height: 52px; padding: 10px 14px; font: inherit; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; border: 1.5px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); }
.field input.ok { background: var(--good); }
.field input.bad { background: var(--bad); }
.verdict { margin: 0 0 14px; font-size: 15px; }
.verdict b { font-weight: 800; }
.opts { display: grid; gap: 8px; margin-bottom: 14px; }
.opt { min-height: 54px; padding: 12px 16px; text-align: left; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; border: 1.5px solid var(--ink); border-radius: 14px; background: #fff; }
.opt.ok { background: var(--good); }
.opt.bad { background: var(--bad); }
.opt:disabled { cursor: default; }
.score { font-family: var(--serif); font-style: italic; font-size: 96px; line-height: .9; margin: 6px 0 4px; }
.review { margin: 22px 0; border-top: 1.5px solid var(--ink); }
.review div { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.review b { font-weight: 800; }
.review span { color: var(--mute); font-size: 14px; }
.review em { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-style: normal; font-weight: 700; font-size: 14px; text-align: right; }
.hint { font-size: 13px; color: var(--mute); }
@media (prefers-reduced-motion: no-preference) { .prog i { transition: width .25s ease; } }
@media (max-width: 380px) { h1 { font-size: 30px; } .prompt .big { font-size: 40px; } .fields, .forms { grid-template-columns: 1fr; } }
</style>
</head>

d"], "sk": "viesť", "g": 3}, {"v1": "shoot", "v2": ["shot"], "v3": ["shot"], "sk": "strieľať", "g": 3}, {"v1": "dig", "v2": ["dug"], "v3": ["dug"], "sk": "kopať", "g": 3}, {"v1": "stick", "v2": ["stuck"], "v3": ["stuck"], "sk": "prilepiť", "g": 3}, {"v1": "hang", "v2": ["hung"], "v3": ["hung"], "sk": "visieť, zavesiť", "g": 3}, {"v1": "sting", "v2": ["stung"], "v3": ["stung"], "sk": "bodnúť", "g": 3}, {"v1": "swing", "v2": ["swung"], "v3": ["swung"], "sk": "hojdať sa", "g": 3}, {"v1": "spin", "v2": ["spun"], "v3": ["spun"], "sk": "točiť", "g": 3}, {"v1": "strike", "v2": ["struck"], "v3": ["struck"], "sk": "udrieť, trafiť", "g": 3}, {"v1": "bleed", "v2": ["bled"], "v3": ["bled"], "sk": "krvácať", "g": 3}, {"v1": "slide", "v2": ["slid"], "v3": ["slid"], "sk": "kĺzať sa", "g": 3}, {"v1": "light", "v2": ["lit"], "v3": ["lit"], "sk": "zapáliť", "g": 3}, {"v1": "shine", "v2": ["shone"], "v3": ["shone"], "sk": "svietiť, žiariť", "g": 3}, {"v1": "come", "v2": ["came"], "v3": ["come"], "sk": "prísť", "g": 4}, {"v1": "run", "v2": ["ran"], "v3": ["run"], "sk": "bežať", "g": 4}, {"v1": "become", "v2": ["became"], "v3": ["become"], "sk": "stať sa", "g": 4}, {"v1": "beat", "v2": ["beat"], "v3": ["beaten"], "sk": "poraziť, biť", "g": 4}, {"v1": "begin", "v2": ["began"], "v3": ["begun"], "sk": "začať", "g": 5}, {"v1": "drink", "v2": ["drank"], "v3": ["drunk"], "sk": "piť", "g": 5}, {"v1": "sing", "v2": ["sang"], "v3": ["sung"], "sk": "spievať", "g": 5}, {"v1": "swim", "v2": ["swam"], "v3": ["swum"], "sk": "plávať", "g": 5}, {"v1": "ring", "v2": ["rang"], "v3": ["rung"], "sk": "zvoniť", "g": 5}, {"v1": "sink", "v2": ["sank"], "v3": ["sunk"], "sk": "potopiť sa", "g": 5}, {"v1": "shrink", "v2": ["shrank"], "v3": ["shrunk"], "sk": "zmenšiť sa", "g": 5}, {"v1": "break", "v2": ["broke"], "v3": ["broken"], "sk": "zlomiť", "g": 6}, {"v1": "speak", "v2": ["spoke"], "v3": ["spoken"], "sk": "hovoriť", "g": 6}, {"v1": "choose", "v2": ["chose"], "v3": ["chosen"], "sk": "vybrať", "g": 6}, {"v1": "steal", "v2": ["stole"], "v3": ["stolen"], "sk": "ukradnúť", "g": 6}, {"v1": "freeze", "v2": ["froze"], "v3": ["frozen"], "sk": "zamrznúť", "g": 6}, {"v1": "wake", "v2": ["woke"], "v3": ["woken"], "sk": "zobudiť sa", "g": 6}, {"v1": "drive", "v2": ["drove"], "v3": ["driven"], "sk": "viesť auto", "g": 6}, {"v1": "ride", "v2": ["rode"], "v3": ["ridden"], "sk": "jazdiť (na koni)", "g": 6}, {"v1": "rise", "v2": ["rose"], "v3": ["risen"], "sk": "vstať, stúpať", "g": 6}, {"v1": "write", "v2": ["wrote"], "v3": ["written"], "sk": "písať", "g": 6}, {"v1": "bite", "v2": ["bit"], "v3": ["bitten"], "sk": "hrýzť", "g": 6}, {"v1": "hide", "v2": ["hid"], "v3": ["hidden"], "sk": "skryť", "g": 6}, {"v1": "forget", "v2": ["forgot"], "v3": ["forgotten"], "sk": "zabudnúť", "g": 6}, {"v1": "give", "v2": ["gave"], "v3": ["given"], "sk": "dať", "g": 6}, {"v1": "forgive", "v2": ["forgave"], "v3": ["forgiven"], "sk": "odpustiť", "g": 6}, {"v1": "forbid", "v2": ["forbade"], "v3": ["forbidden"], "sk": "zakázať", "g": 6}, {"v1": "take", "v2": ["took"], "v3": ["taken"], "sk": "vziať", "g": 6}, {"v1": "shake", "v2": ["shook"], "v3": ["shaken"], "sk": "triasť", "g": 6}, {"v1": "eat", "v2": ["ate"], "v3": ["eaten"], "sk": "jesť", "g": 6}, {"v1": "fall", "v2": ["fell"], "v3": ["fallen"], "sk": "padať", "g": 6}, {"v1": "see", "v2": ["saw"], "v3": ["seen"], "sk": "vidieť", "g": 6}, {"v1": "know", "v2": ["knew"], "v3": ["known"], "sk": "vedieť, poznať", "g": 7}, {"v1": "grow", "v2": ["grew"], "v3": ["grown"], "sk": "rásť", "g": 7}, {"v1": "throw", "v2": ["threw"], "v3": ["thrown"], "sk": "hodiť", "g": 7}, {"v1": "blow", "v2": ["blew"], "v3": ["blown"], "sk": "fúkať", "g": 7}, {"v1": "fly", "v2": ["flew"], "v3": ["flown"], "sk": "lietať", "g": 7}, {"v1": "draw", "v2": ["drew"], "v3": ["drawn"], "sk": "kresliť, ťahať", "g": 7}, {"v1": "show", "v2": ["showed"], "v3": ["shown"], "sk": "ukázať", "g": 7}, {"v1": "wear", "v2": ["wore"], "v3": ["worn"], "sk": "nosiť (odev)", "g": 7}, {"v1": "tear", "v2": ["tore"], "v3": ["torn"], "sk": "trhať", "g": 7}, {"v1": "swear", "v2": ["swore"], "v3": ["sworn"], "sk": "prisahať", "g": 7}, {"v1": "be", "v2": ["was", "were"], "v3": ["been"], "sk": "byť", "g": 8}, {"v1": "do", "v2": ["did"], "v3": ["done"], "sk": "robiť", "g": 8}, {"v1": "go", "v2": ["went"], "v3": ["gone", "been"], "sk": "ísť", "g": 8}, {"v1": "lie", "v2": ["lay"], "v3": ["lain"], "sk": "ležať", "g": 8}, {"v1": "learn", "v2": ["learnt", "learned"], "v3": ["learnt", "learned"], "sk": "učiť sa", "g": 8}, {"v1": "burn", "v2": ["burnt", "burned"], "v3": ["burnt", "burned"], "sk": "horieť, páliť", "g": 8}, {"v1": "fit", "v2": ["fit"], "v3": ["fit"], "sk": "pasovať", "g": 8}];
const GROUPS = ["V1 = V2 = V3", "V2 = V3 · -ought", "V2 = V3 · -t / -d", "V2 = V3 · ostatné", "V1 = V3", "I – A – U", "V3 na -en", "V3 na -n", "Zvláštne"];
const ROUND = 10;
const app = document.getElementById('app');

const S = { screen: 'start', mode: 'cards', groups: new Set(GROUPS.map((_, i) => i)), onlyWeak: false,
            queue: [], i: 0, revealed: false, checked: false, picked: null, results: [], opts: [] };

function loadWeak() { try { return new Set(JSON.parse(localStorage.getItem('kv_weak') || '[]')); } catch (e) { return new Set(); } }
function saveWeak(set) { try { localStorage.setItem('kv_weak', JSON.stringify([...set])); } catch (e) {} }
let WEAK = loadWeak();

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.trim().toLowerCase().replace(/\s*\/\s*/g, '/').replace(/\s+/g, ' ');
const forms = list => list.join(' / ');
const isOk = (input, list) => { const n = norm(input); return !!n && (list.map(norm).includes(n) || n === norm(list.join('/'))); };

function regular(v1) {
  if (/[^aeiou]y$/.test(v1)) return v1.slice(0, -1) + 'ied';
  if (/e$/.test(v1)) return v1 + 'd';
  return v1 + 'ed';
}
function makeOptions(v) {
  const a = v.v2[0], b = v.v3[0], right = a + ' – ' + b;
  const set = new Set([right]);
  const add = t => {
    if (!t || set.has(t) || set.size >= 4) return;
    const [x, y] = t.split(' – ');
    if (v.v2.includes(x) && v.v3.includes(y)) return;   // also a valid answer (burnt/burned, learnt/learned)
    set.add(t);
  };
  const r = regular(v.v1);
  add(r + ' – ' + r);
  add(a !== b ? b + ' – ' + a : a + ' – ' + v.v1);
  const sameGroup = shuffle(VERBS.filter(o => o.g === v.g && o.v1 !== v.v1));
  if (sameGroup[0]) add(a + ' – ' + sameGroup[0].v3[0]);
  for (const o of shuffle(VERBS)) { if (set.size >= 4) break; if (o.v1 !== v.v1) add(o.v2[0] + ' – ' + o.v3[0]); }
  return { right, list: shuffle([...set]) };
}

function pool() {
  if (S.onlyWeak) return VERBS.filter(v => WEAK.has(v.v1));
  return VERBS.filter(v => S.groups.has(v.g));
}

function start() {
  const p = pool();
  if (!p.length) return;
  S.queue = shuffle(p).slice(0, ROUND);
  S.i = 0; S.revealed = false; S.checked = false; S.picked = null; S.results = [];
  S.opts = S.mode === 'choice' ? S.queue.map(makeOptions) : [];
  S.screen = 'game';
  render();
}

function record(v, ok) {
  S.results.push({ v, ok });
  if (ok) WEAK.delete(v.v1); else WEAK.add(v.v1);
  saveWeak(WEAK);
}

function next() {
  if (S.i + 1 >= S.queue.length) { S.screen = 'result'; }
  else { S.i++; S.revealed = false; S.checked = false; S.picked = null; }
  render();
}

function viewStart() {
  const p = pool();
  const allOn = S.groups.size === GROUPS.length;
  const modes = [
    ['cards', 'Karty', 'Pozri sloveso, potom odhaľ tvary.'],
    ['type', 'Dopíš', 'Napíš druhý a tretí tvar.'],
    ['choice', 'Vyber', 'Nájdi správnu dvojicu tvarov.']
  ];
  return `
  <h1>Nepravidelné <em>slovesá</em></h1>
  <p class="lead">${VERBS.length} slovies, tri spôsoby, kolo má ${ROUND} otázok. Vyber, čo chceš trénovať.</p>
  <div class="sect">
    <h2 class="label">Skupiny</h2>
    <div class="chips">
      <button class="chip" data-a="all" aria-pressed="${allOn && !S.onlyWeak}">Všetky</button>
      ${GROUPS.map((g, i) => `<button class="chip" data-a="grp" data-i="${i}" aria-pressed="${S.groups.has(i) && !allOn && !S.onlyWeak}">${esc(g)}</button>`).join('')}
      ${WEAK.size ? `<button class="chip" data-a="weak" aria-pressed="${S.onlyWeak}">Moje chyby (${WEAK.size})</button>` : ''}
    </div>
  </div>
  <div class="sect">
    <h2 class="label" id="modelabel">Režim</h2>
    <div class="modes" role="radiogroup" aria-labelledby="modelabel">
      ${modes.map(m => `<button class="mode" role="radio" aria-checked="${S.mode === m[0]}" data-a="mode" data-m="${m[0]}"><b>${m[1]}</b><i></i><span>${m[2]}</span></button>`).join('')}
    </div>
  </div>
  <button class="btn primary block" data-a="start" ${p.length ? '' : 'disabled'}>Začať (${Math.min(ROUND, p.length)} slovies)</button>
  <p class="hint" style="margin-top:12px">Slovesá, ktoré si pokazil, si tréner zapamätá v tomto prehliadači.</p>`;
}

function bar() {
  const pct = Math.round((S.i / S.queue.length) * 100);
  return `<div class="gamebar"><button class="x" data-a="quit" aria-label="Skončiť kolo">×</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${S.queue.length}" aria-valuenow="${S.i}"><i style="width:${pct}%"></i></div>
    <div class="count">${S.i + 1} / ${S.queue.length}</div></div>`;
}
function prompt(v) {
  return `<div class="prompt"><div class="label">V1</div><div class="big">${esc(v.v1)}</div><div class="sk">${esc(v.sk)}</div></div>`;
}
function ipa(v) { return v.ipa ? `<p class="ipa">${esc(v.ipa)}</p>` : ''; }
const nextLabel = () => (S.i + 1 >= S.queue.length ? 'Výsledok' : 'Ďalej');

function viewGame() {
  const v = S.queue[S.i];
  if (S.mode === 'cards') {
    return bar() + prompt(v) + (S.revealed
      ? `<div class="forms"><div class="form"><div class="label">V2</div><div class="big">${esc(forms(v.v2))}</div></div>
         <div class="form"><div class="label">V3</div><div class="big">${esc(forms(v.v3))}</div></div></div>${ipa(v)}
         <div class="row"><button class="btn" data-a="grade" data-ok="0">Ešte nie</button><button class="btn primary" data-a="grade" data-ok="1">Viem</button></div>`
      : `<button class="btn primary block" data-a="reveal">Ukázať tvary</button>`);
  }
  if (S.mode === 'type') {
    const c = S.checked;
    const r = S.results[S.results.length - 1];
    return bar() + prompt(v) + `
      <form id="typeform" autocomplete="off">
        <div class="fields">
          <div class="field"><label class="label" for="in2">V2</label><input id="in2" class="${c ? (r.ok2 ? 'ok' : 'bad') : ''}" ${c ? 'readonly' : ''} autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" value="${c ? esc(r.a2) : ''}"></div>
          <div class="field"><label class="label" for="in3">V3</label><input id="in3" class="${c ? (r.ok3 ? 'ok' : 'bad') : ''}" ${c ? 'readonly' : ''} autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${c ? esc(r.a3) : ''}"></div>
        </div>
        ${c ? `<p class="verdict">${r.ok ? '<b>Správne.</b>' : `<b>Správne je:</b> ${esc(forms(v.v2))} · ${esc(forms(v.v3))}`}</p>${ipa(v)}` : ''}
        <button class="btn primary block" type="submit">${c ? nextLabel() : 'Skontrolovať'}</button>
      </form>`;
  }
  const o = S.opts[S.i];
  return bar() + prompt(v) + `<div class="opts">${o.list.map((t, k) => {
    let cls = '';
    if (S.picked !== null) cls = t === o.right ? 'ok' : (k === S.picked ? 'bad' : '');
    return `<button class="opt ${cls}" data-a="pick" data-k="${k}" ${S.picked !== null ? 'disabled' : ''}>${esc(t)}</button>`;
  }).join('')}</div>` + (S.picked !== null ? ipa(v) + `<button class="btn primary block" data-a="next">${nextLabel()}</button>` : '');
}

function viewResult() {
  const ok = S.results.filter(r => r.ok).length, n = S.results.length;
  const wrong = S.results.filter(r => !r.ok);
  const msg = ok === n ? 'Bez chyby. Skvelé.' : ok >= n * 0.7 ? 'Dobré kolo. Ešte pár chýb na zopakovanie.' : 'Dá sa to. Zopakuj si slovesá nižšie a skús znova.';
  return `<div class="label">Výsledok</div>
    <div class="score">${ok}/${n}</div>
    <p class="lead" style="margin:8px 0 0">${msg}</p>
    ${wrong.length ? `<div class="review" role="list">${wrong.map(r => `<div role="listitem"><b>${esc(r.v.v1)}</b><span>${esc(r.v.sk)}</span><em>${esc(forms(r.v.v2))} · ${esc(forms(r.v.v3))}</em></div>`).join('')}</div>` : '<div style="height:22px"></div>'}
    <div class="row"><button class="btn" data-a="menu">Späť</button><button class="btn primary" data-a="again">Ďalšie kolo</button></div>`;
}

function render() {
  app.innerHTML = S.screen === 'start' ? viewStart() : S.screen === 'game' ? viewGame() : viewResult();
  const f = app.querySelector('#in2:not([readonly])');
  if (f) f.focus();
  else if (S.mode === 'type' && S.checked) { const b = app.querySelector('button[type=submit]'); if (b) b.focus(); }
  const t = app.querySelector('h1, .label'); window.scrollTo(0, 0);
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'all') { S.onlyWeak = false; S.groups = new Set(GROUPS.map((_, i) => i)); render(); }
  else if (a === 'grp') {
    const i = +b.dataset.i;
    S.onlyWeak = false;
    if (S.groups.size === GROUPS.length) S.groups = new Set([i]);
    else if (S.groups.has(i)) { S.groups.delete(i); if (!S.groups.size) S.groups = new Set(GROUPS.map((_, k) => k)); }
    else S.groups.add(i);
    render();
  }
  else if (a === 'weak') { S.onlyWeak = !S.onlyWeak; render(); }
  else if (a === 'mode') { S.mode = b.dataset.m; render(); }
  else if (a === 'start' || a === 'again') start();
  else if (a === 'menu' || a === 'quit') { S.screen = 'start'; WEAK = loadWeak(); render(); }
  else if (a === 'reveal') { S.revealed = true; render(); }
  else if (a === 'grade') { record(S.queue[S.i], b.dataset.ok === '1'); next(); }
  else if (a === 'pick') {
    const o = S.opts[S.i], k = +b.dataset.k; S.picked = k;
    record(S.queue[S.i], o.list[k] === o.right); render();
    const nb = app.querySelector('[data-a=next]'); if (nb) nb.focus();
  }
  else if (a === 'next') next();
});

app.addEventListener('submit', e => {
  e.preventDefault();
  if (S.screen !== 'game' || S.mode !== 'type') return;
  if (S.checked) { next(); return; }
  const v = S.queue[S.i];
  const a2 = document.getElementById('in2').value, a3 = document.getElementById('in3').value;
  const ok2 = isOk(a2, v.v2), ok3 = isOk(a3, v.v3);
  S.checked = true;
  record(v, ok2 && ok3);
  Object.assign(S.results[S.results.length - 1], { a2, a3, ok2, ok3 });
  render();
});

render();
</script>
</body>
</html>
